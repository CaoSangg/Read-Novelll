<dialog class="reader-progress-dialog" id="reader-guest-clear"
  aria-labelledby="reader-guest-clear-title" aria-describedby="reader-guest-clear-description">
  <h2 id="reader-guest-clear-title">Xóa tiến độ trên thiết bị?</h2>
  <p id="reader-guest-clear-description">Thao tác này xóa vị trí Đọc tiếp và các chương đã xác nhận của truyện này trên thiết bị.</p>
  <div class="reader-progress-dialog-actions">
    <button type="button" data-reader-clear-cancel autofocus>Hủy</button>
    <button type="button" data-reader-clear-confirm>Xóa tiến độ</button>
  </div>
</dialog>
