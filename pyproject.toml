[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "read-novel"
version = "1.5.0"
description = "Web Đọc Tiểu Thuyết Khấu Vấn Tiên Đạo - FastAPI & Jinja2 Reader Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "psycopg[binary]>=3.1.19,<4.0.0",
    "psycopg-pool>=3.2.2,<4.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "pwdlib[argon2]>=0.2.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    ".agent",
    ".agents",
    "node_modules",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
