name: Deploy Production

on:
  push:
    branches: [ "main" ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  kiem-tra-chat-luong:
    name: CI Pre-check Truoc Khi Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Keo code ve may ao
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Cai dat dependencies
        run: npm install

      - name: Kiem tra Build Next.js voi bien moi truong dummy
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://dummyprojectid.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-placeholder-for-ci-build"

  deploy-production:
    name: Deploy Len Production
    needs: [kiem-tra-chat-luong]
    runs-on: ubuntu-latest
    steps:
      - name: Keo code ve
        uses: actions/checkout@v4

      - name: Cai dat Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Thong Tin Environment (Production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project voi Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Artifacts len Production
        id: deploy_prod
        run: |
          echo "=== Dang thuc hien deploy Production ==="
          PROD_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "prod_url=$PROD_URL" >> $GITHUB_OUTPUT

          echo "### 🌟 Vercel Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Trang thai:** Trien khai Production thanh cong ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Nhanh (Branch):** \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL:** [$PROD_URL]($PROD_URL)" >> $GITHUB_STEP_SUMMARY
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
