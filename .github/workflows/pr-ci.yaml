name: PR Quality Gate & CI Check

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "hotfix/**"

jobs:
  kiem-tra-chat-luong:
    if: github.ref != 'refs/heads/feature/aws-migration'
    name: Kiem Tra Next.js Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Keo code ve may ao
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Cai dat dependencies
        run: npm install

      - name: Kiem tra Linting
        run: npm run lint

      - name: Kiem tra Build Next.js voi bien moi truong dummy
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://dummyprojectid.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-placeholder-for-ci-build"

      - name: Xuat bao cao kiem tra ra GitHub Step Summary
        if: always()
        run: |
          echo "### 🔍 Ket qua CI Quality Gate Check" >> $GITHUB_STEP_SUMMARY
          echo "- **Trang thai:** ${{ job.status == 'success' && 'Thanh cong ✅' || 'That bai ❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Nhanh (Branch):** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Kiem tra:** Linting & Next.js Build pass hoàn tất" >> $GITHUB_STEP_SUMMARY
